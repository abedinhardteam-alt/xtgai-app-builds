name: XTG App Builder
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Only build this Firestore job id (optional)"
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: xtg-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.3"
          cache-read-only: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build queued apps
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_JOB: ${{ github.event.inputs.job }}
          POLL_SECONDS: "230"
        run: node builder/poll.js
